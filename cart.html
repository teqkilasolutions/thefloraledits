<!doctype html>
<html lang="en" class="sub"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Bag | The Floral Edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Marcellus&display=swap">
<meta name="theme-color" content="#3D631C">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<main class="wrap">
  <div class="intro"><span class="eyebrow">Your bag</span><h1>Ready when you are</h1></div>
  <div id="cart" style="margin-top:36px"></div>
</main>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  App.layout('cart');
  var D=DATA,root=document.getElementById('cart'),FREE=3000,SHIP=250;
  function lineHtml(it){
    var th,nm,sub,u=App.unit(it);
    if(it.t==='s'){var s=App.setOf(it.id);if(!s)return '';th=Art.group(App.setItems(s));nm=s.name;sub='Set of '+s.items.length+', arranged \u00b7 '+D.tiers[s.tier||'ready'].n}
    else{var p=D.byId[it.id];if(!p)return '';th=App.art(p,it.o);nm=p.name;sub=App.optLabel(it)}
    return '<div class="line"><div class="th">'+th+'</div><div><h3>'+nm+'</h3><div class="sub">'+sub+'</div><div class="ctl"><div class="qty"><button type="button" data-k="'+it.k+'" data-d="-1" aria-label="Decrease quantity">\u2212</button><b>'+it.q+'</b><button type="button" data-k="'+it.k+'" data-d="1" aria-label="Increase quantity">+</button></div><button class="x" type="button" data-rm="'+it.k+'">Remove</button></div></div><div class="lp">'+App.money(u*it.q)+'</div></div>';
  }
  function render(){
    var c=App.load().filter(function(i){return i.t==='s'?App.setOf(i.id):D.byId[i.id]});
    if(!c.length){root.innerHTML='<div class="empty" style="padding-block:40px 120px"><p style="margin:0 auto 24px">Your bag is empty.</p><a class="btn" href="shop.html">Shop vases</a></div>';App.count();return}
    var sub=0;c.forEach(function(i){sub+=App.unit(i)*i.q});
    var ship=sub>=FREE?0:SHIP,left=Math.max(0,FREE-sub);
    root.innerHTML='<div class="cart"><div id="lines">'+c.map(lineHtml).join('')+'</div>'+
     '<aside class="sum" aria-label="Order summary"><h3>Summary</h3>'+
     '<div class="meter" aria-hidden="true"><i style="width:'+Math.min(100,sub/FREE*100)+'%"></i></div>'+
     '<div class="avail"><b>Estimated delivery: '+App.leadOf(c).n+'</b><span>Set by the slowest flower in your bag. Flowers are subject to availability.</span></div><p style="font-size:13.5px" class="mute">'+(left?'Add '+App.money(left)+' more for free delivery.':'You have free delivery.')+'</p>'+
     '<div class="r"><span>Subtotal</span><span>'+App.money(sub)+'</span></div><div class="r"><span>Delivery</span><span>'+(ship?App.money(ship):'Free')+'</span></div>'+
     '<div class="r tot"><span>Total</span><span>'+App.money(sub+ship)+'</span></div>'+
     '<form id="co" novalidate><label for="n">Name<input id="n" autocomplete="name"></label><label for="ph">Phone<input id="ph" inputmode="tel" autocomplete="tel"></label><label for="ad">Delivery address<textarea id="ad" style="min-height:80px" autocomplete="street-address"></textarea></label><label for="dt">Delivery date<input id="dt" type="date"></label><button class="btn" type="submit" style="justify-content:center">Place order</button><div class="note" id="msg" hidden></div></form></aside></div>';
    root.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){
      var cc=App.load().slice(),k=b.getAttribute('data-k');cc.forEach(function(i){if(i.k===k)i.q=Math.max(1,Math.min(20,i.q+parseInt(b.getAttribute('data-d'),10)))});App.save(cc);render();
    })});
    root.querySelectorAll('[data-rm]').forEach(function(b){b.addEventListener('click',function(){
      var k=b.getAttribute('data-rm');App.save(App.load().filter(function(i){return i.k!==k}));render();
    })});
    document.getElementById('co').addEventListener('submit',function(e){
      e.preventDefault();
      var n=document.getElementById('n').value.trim(),ph=document.getElementById('ph').value.trim(),ad=document.getElementById('ad').value.trim(),m=document.getElementById('msg');
      m.hidden=false;
      if(!n||!ph||!ad){m.textContent='Please add your name, phone number and delivery address.';return}
      var no='TFE-'+Math.floor(1000+Math.random()*9000);
      App.save([]);App.count();
      root.innerHTML='<div class="empty" style="padding-block:40px 120px;display:grid;gap:18px;justify-items:center"><svg viewBox="0 0 56 56" width="56" height="56" fill="none" stroke="var(--accent)" stroke-width="1.3"><circle cx="28" cy="28" r="24"/><path d="M17 29l8 8 14-17"/></svg><h2>Thank you, '+n.replace(/[<>&]/g,'')+'.</h2><p class="mute">Order '+no+' is ready to confirm. This preview takes no payment and sends nothing yet, so connect checkout before going live.</p><a class="btn" href="shop.html">Keep browsing</a></div>';
    });
  }
  render();
})();
</script>
</body></html>
