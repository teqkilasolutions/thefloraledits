<!doctype html>
<html lang="en" class="sub"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vase | The Floral Edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Marcellus&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<main class="wrap">
  <div class="crumb"><a href="shop.html">Shop</a> / <span id="cr">Vase</span></div>
  <div class="pd" id="pd"></div>
  <section style="padding-bottom:clamp(40px,6vw,90px)">
    <div class="head" data-rv><div><span class="eyebrow">You may also like</span><h2>More from the collection</h2></div></div>
    <div class="grid" id="more" data-stagger></div>
  </section>
</main>
<script src="assets/data.js"></script>
<script src="assets/art.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  App.layout('shop');
  var D=DATA,id=(location.hash||'').slice(1);
  if(!D.byId[id]){try{id=sessionStorage.getItem('tfe_pid')||''}catch(e){}}
  var p=D.byId[id]||D.products[0];
  document.title=p.name+' | The Floral Edit';
  document.getElementById('cr').textContent=p.name;
  var opt='arr',qty=1;
  var names={home:'Home',office:'Office',party:'Parties',cultural:'Cultural events'};
  var pd=document.getElementById('pd');
  pd.innerHTML=
   '<div class="pd-art" id="pa"></div>'+
   '<div class="pd-info">'+
     '<span class="eyebrow">'+(p.theme?'Theme pot \u00b7 '+App.badge(p):'Studio collection')+'</span>'+
     '<h1 style="font-size:clamp(2.2rem,4.6vw,3.6rem)">'+p.name+'</h1>'+
     '<div class="price" id="pp"></div>'+
     '<p class="mute">'+p.blurb+'</p>'+
     (p.theme?'<p class="eyebrow" style="color:var(--mute)">Mood inspired by '+p.insp.join(', ')+'</p>':'')+
     '<div class="opts" role="radiogroup" aria-label="Choose an option">'+
       '<div class="opt" role="radio" tabindex="0" data-o="vase"><div>Vase only<small>Ready for your own flowers</small></div><span>'+App.money(p.price)+'</span></div>'+
       '<div class="opt" role="radio" tabindex="0" data-o="arr"><div>Vase with arrangement<small>Styled as shown, '+(p.arr.s==='grass'||p.deco?'dried':'fresh or preserved')+' flowers</small></div><span>'+App.money(p.price+p.addon)+'</span></div>'+
     '</div>'+
     '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><div class="qty"><button type="button" id="mn" aria-label="Decrease">\u2212</button><b id="q">1</b><button type="button" id="pl" aria-label="Increase">+</button></div><button class="btn" id="addb" type="button" style="flex:1;justify-content:center;min-width:200px">Add to bag</button></div>'+
     '<div class="spec"><div><span>Size</span><span>'+p.size+'</span></div><div><span>Material</span><span>'+p.mat+'</span></div><div><span>Delivery</span><span>Same-day in Delhi NCR before 2 pm</span></div><div><span>Care</span><span>Hand wash, dry upright</span></div></div>'+
     '<div><span class="eyebrow" style="display:block;margin-bottom:12px">Styled in</span><div class="pills">'+p.tags.map(function(t){return '<a href="shop.html#'+t+'">'+names[t]+'</a>'}).join('')+'</div></div>'+
   '</div>';
  var pa=document.getElementById('pa'),pp=document.getElementById('pp');
  function paint(){
    pa.innerHTML=Art.vase(p,{arranged:opt==='arr'});
    pa.firstChild.style.animation='pagein .8s both';
    pp.textContent=App.money((p.price+(opt==='arr'?p.addon:0))*qty);
    pd.querySelectorAll('.opt').forEach(function(o){o.setAttribute('aria-checked',String(o.getAttribute('data-o')===opt))});
    document.getElementById('q').textContent=qty;
  }
  pd.querySelectorAll('.opt').forEach(function(o){
    function pick(){opt=o.getAttribute('data-o');paint()}
    o.addEventListener('click',pick);o.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});
  });
  document.getElementById('mn').addEventListener('click',function(){qty=Math.max(1,qty-1);paint()});
  document.getElementById('pl').addEventListener('click',function(){qty=Math.min(9,qty+1);paint()});
  document.getElementById('addb').addEventListener('click',function(){App.add('p',p.id,opt,qty)});
  paint();

  var more=D.products.filter(function(x){return x.id!==p.id&&x.tags.some(function(t){return p.tags.indexOf(t)>-1})}).slice(0,4);
  var mo=document.getElementById('more');mo.innerHTML=more.map(App.card).join('');
  App.wire();App.reveal();
})();
</script>
</body></html>
